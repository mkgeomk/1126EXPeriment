<style>

function parseTSV(text){ // табличный текст из Excel: столбцы через таб, ячейки с переносами — в кавычках
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if (c==='"' && cell==="") q=true;
    else if (c==="\t"){ row.push(cell); cell=""; }
    else if (c==="\n" || c==="\r"){ if (c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  if (cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function phonesFrom(txt){ return String(txt||"").split(/[,;\n]+/).map(x=>x.trim()).filter(x=>(x.match(/\d/g)||[]).length>=10); }
const FMT_B = v => (typeof v==="number" && isFinite(v) && v>=0.005) ? v.toFixed(2).replace(".",",")+" млрд ₽" : "—";
function numFrom(x){ if (typeof x==="number") return isFinite(x)?x:null;
  let s=String(x==null?"":x).replace(/[\s\u00a0]/g,""); s = /^\d{1,3}(,\d{3}){2,}(\.\d+)?$/.test(s) ? s.replace(/,/g,"") : s.replace(",","."); if(!s||!/^-?[\d.]+(e[+-]?\d+)?$/i.test(s)) return null;
  const n=Number(s); return isFinite(n)?n:null; }
function unitB(h, dflt){ h=(h||"").toLowerCase(); if(/млрд/.test(h)) return 1; if(/млн/.test(h)) return 1e-3; if(/тыс/.test(h)) return 1e-6; return dflt; }   // множитель к млрд

  return XLSX_P; }
function importList(text){ return importRows(parseTSV(text)); }
function importRows(all){
  const hi = all.slice(0,3).findIndex(r=>r.some(c=>c.trim().toLowerCase()==="инн"));   // строка заголовков (бывает вторая)
  if (hi<0 || all.length<hi+2) return {err:"Не нашёл строку заголовков со столбцом «ИНН» или данные под ней. Скопируй из Excel вместе с заголовками."};
  const raw = all[hi].map(h=>h.trim()), hdr = raw.map(h=>h.toLowerCase());
  const iName = hdr.findIndex(h=>h.includes("компани")||h.includes("наименование"));
  const iInn = hdr.findIndex(h=>h==="инн");            // первый столбец ИНН — компания
  const iFio = hdr.findIndex(h=>h.includes("фио"));
  const iPh = hdr.map((h,i)=>(/(тел|номер|контакт|моб|phone|альтернатив)/.test(h) && !/(инн|фио|почт|mail|адрес|сайт)/.test(h) && !(/лпр/.test(h) && !/(номер|тел|моб)/.test(h)) && i!==iName && i!==iFio)?i:-1).filter(i=>i>=0);
  const iRev = hdr.findIndex(h=>/выруч/.test(h)), iImp = hdr.findIndex(h=>/импорт/.test(h)), iExp = hdr.findIndex(h=>/экспорт/.test(h)), iReg = hdr.findIndex(h=>/(област|регион)/.test(h));
  const uRev = unitB(raw[iRev],1e-9), uImp = unitB(raw[iImp],1e-9), uExp = unitB(raw[iExp],1e-9);
  if (iName<0) return {err:"Не нашёл столбец с названием компании («Компания» или «Наименование»)."};
  return {rows:all.slice(hi+1), iName, iInn, iFio, iPh, iRev, iImp, iExp, iReg, uRev, uImp, uExp, cols:{name:raw[iName], inn:raw[iInn], fio:iFio>=0?raw[iFio]:"—", ph:iPh.map(i=>raw[i]), rev:iRev>=0?raw[iRev]:"—", imp:iImp>=0?raw[iImp]:"—", exp:iExp>=0?raw[iExp]:"—", reg:iReg>=0?raw[iReg]:"—"}};
}
async function runImport(src,dry,prog){
  const r = typeof src==="string" ? importList(src) : importRows(src); if (r.err) return r;
  let added=0, dup=0, upd=0, bad=0; const seen=new Set(), todo=[];
  const ORD0=Date.now()*1000; let ri=0;
  for (const row of r.rows){ ri++;
    const inn=(row[r.iInn]||"").replace(/\D/g,""), name=(row[r.iName]||"").trim();
    if (!/^(\d{10}|\d{12})$/.test(inn) || !name){ bad++; continue; }
    const ex = {ord:ORD0+ri};
    if (r.iRev>=0){ const v=numFrom(row[r.iRev]); if (v!=null) ex.rev=v*r.uRev; }
    if (r.iImp>=0){ const v=numFrom(row[r.iImp]); if (v!=null) ex.imp=v*r.uImp; }
    if (r.iExp>=0){ const v=numFrom(row[r.iExp]); if (v!=null) ex.exp=v*r.uExp; }
    if (r.iReg>=0){ const g=String(row[r.iReg]||"").trim(); if (g && !/^(москва|московская)/i.test(g)) ex.reg=g; }
    if(seen.has(inn)){dup++;continue;} seen.add(inn);
    const old = LEADS[inn];
    if (old){ let ch=false; for (const k of ["rev","imp","exp","reg","ord"]) if (ex[k]!==undefined && old[k]===undefined){ if(!dry) old[k]=ex[k]; ch=true; }
      if (ch){ if(!dry) todo.push(old); upd++; } else dup++; continue; }
    const phones=[]; r.iPh.forEach(i=>phonesFrom(row[i]).forEach(p=>{ if(!phones.includes(p)) phones.push(p); }));
    if(dry){ added++; continue; }
    todo.push({inn, name, fio: r.iFio>=0?(row[r.iFio]||"").trim():"", pos:"", phones, status:"Новый клиент", tag:"", next:"", nextTime:"", nextWhat:"", hooks:[], hist:[], created:iso(today()), closed:null, ...ex});
    added++;
  }
  let done=0, failed=0, pos=0;
  const worker=async()=>{ while(pos<todo.length){ const l=todo[pos++]; let ok=false; try{ ok=await save(l); }catch{} if(!ok) failed++; done++; if(prog) prog(done,todo.length); } };
  if(!dry) await Promise.all(Array.from({length:Math.min(5,todo.length)},worker));
  return {added, dup, upd, bad, failed, cols:r.cols};
}

function inTxt(tm){const [h,m]=tm.split(":").map(Number),d=new Date();const diff=h*60+m-(d.getHours()*60+d.getMinutes());if(diff<=0)return "сейчас";if(diff<60)return "через "+diff+" мин";return "через "+Math.floor(diff/60)+" ч"+(diff%60?" "+diff%60+" мин":"");}
function setTab(t){TAB=t;CUR=null;CALL=null;SEL=null;draw();}
function startCall(inn){const l=LEADS[inn];if(!l)return;CALL={inn,t0:Date.now(),hist:[{id:"start",theme:l.theme||null}]};CUR=null;draw();}

// ---------- Профиль и подстановки в фразы ----------
let PROFILE={name:"",bank:"",pos:"",done:false};
async function loadProfile(){const v=await store.get(["profile"]);try{const p=JSON.parse((v&&v.profile)||"null");if(p&&typeof p==="object")Object.assign(PROFILE,p);}catch{}}
async function saveProfile(){await store.set("profile",JSON.stringify(PROFILE));}
const initial=()=>(((PROFILE.name||TGNAME||"Г").trim()[0])||"Г").toUpperCase();
function sub(s){return String(s).replace(/\[(имя|Имя)\]/g,PROFILE.name||"[Имя]").replace(/\[банк\]/g,PROFILE.bank||"[банк]").replace(/\[должность\]/g,PROFILE.pos||"[должность]");}

function rowH(l,o){o=o||{};const t=iso(today()),late=!!(l.next&&l.next<t&&!l.closed);
  const [pt,pc]=o.pill||(late?["Просрочено","r"]:stShort(l.status));
  const right=o.rightB!=null?`<span class="rr"><b>${esc(o.rightB)}</b>${o.rightS?`<small>${esc(o.rightS)}</small>`:""}</span>`:`<span class="rr${late?" bad":""}"><b>${esc(whenTxt(l))}</b></span>`;
  return `<button class="row" type="button" data-open="${esc(l.inn)}"><span class="av">${esc(ini(l.name))}</span><span class="rm"><b>${esc(l.name)}</b><small>${esc(o.sub!=null?o.sub:subLine(l))}</small></span>${right}${o.noPill?"":pillH(pt,pc)}</button>`;}

const selBtn=()=>`<button class="lnk" type="button" data-selmode style="margin-right:6px">Выбрать</button>`;
function selRowH(l,sub){const on=SEL&&SEL.has(l.inn);return `<button class="row" type="button" data-selrow="${esc(l.inn)}"><span class="ck${on?" on":""}"></span><span class="rm"><b>${esc(l.name)}</b><small>${esc(sub!=null?sub:subLine(l))}</small></span></button>`;}
function selBar(){const n=SEL?SEL.size:0,allOn=SELVIS.length&&SELVIS.every(x=>SEL.has(x));
  return `<div class="bar" id="selbar"><button class="gbtn" type="button" data-selcancel style="flex:1">Готово</button><button class="gbtn" type="button" data-selall style="flex:1">${allOn?"Снять все":"Выбрать все"}</button><button class="btn${n?"":" dis"}" type="button" data-seldel style="flex:1.3;background:var(--bad);color:#fff;height:44px;font-size:15px">Удалить${n?" ("+n+")":""}</button></div>`;}

const SORTS=[["added","Как добавили"],["long","Дольше всех"],["alpha","По алфавиту"],["rev","По выручке"],["imp","По импорту"],["exp","По экспорту"]];
let SORT_NEW="added",SORT_CL="added";
function sortLeads(a,k){const arr=a.slice();
  if(k==="alpha")return arr.sort(byName);
  if(k==="added")return arr.sort((x,y)=>{const hx=typeof x.ord==="number",hy=typeof y.ord==="number";if(hx!==hy)return hx?-1:1;return hx?(x.ord-y.ord):((x.created||"").localeCompare(y.created||"")||byName(x,y));});
  if(k==="long")return arr.sort((x,y)=>(x.created||"").localeCompare(y.created||"")||byName(x,y));
  const ok=l=>typeof l[k]==="number"&&l[k]>=0.005;
  return arr.sort((x,y)=>{const a1=ok(x),b1=ok(y);if(a1!==b1)return a1?-1:1;return((y[k]||0)-(x[k]||0))||byName(x,y);});}
const sortCap=k=>k==="rev"?"выручка":k==="imp"?"импорт":k==="exp"?"экспорт":"";

// ---------- Сегодня ----------
let SEG="calls",FILT="today",QTXT="",NEW_ALL=false;
function drawToday(){
  const nw=active().filter(isNew);
  const mid=`<div class="seg" style="margin:0 auto"><button type="button" data-seg="calls" class="${SEG==="calls"?"on":""}">Звонки</button><button type="button" data-seg="new" class="${SEG==="new"?"on":""}">Новые${nw.length?` <b>${nw.length}</b>`:""}</button></div>`;
  main.innerHTML=headH(mid,`<button class="ib" type="button" data-imp aria-label="Загрузить список">${IC.upload}</button>`)+
   `<div class="search">${IC.search}<input id="q" placeholder="Компания, ИНН или ФИО" value="${esc(QTXT)}" aria-label="Поиск"></div><div id="tl"></div>`;
  fillToday();
  document.getElementById("q").addEventListener("input",e=>{QTXT=e.target.value;fillToday();});
}
function todayData(){const t=iso(today()),act=active().filter(l=>!isNew(l));
  const todayL=act.filter(l=>l.next===t).sort(byTime),
    over=act.filter(l=>l.next&&l.next<t).sort((a,b)=>a.next.localeCompare(b.next)||byTime(a,b)),
    nod=act.filter(l=>!l.next),
    soon=act.filter(l=>l.next>t&&l.next<=addDays(3)).sort((a,b)=>a.next.localeCompare(b.next)||byTime(a,b)),
    nw=active().filter(isNew);
  const nowS=nowHM(),up=todayL.find(l=>!l.nextTime||l.nextTime>=nowS)||null;
  return {todayL,over,nod,soon,nw,up,act};}
function fillToday(){
  const el=document.getElementById("tl");if(!el)return;
  const v=QTXT.trim().toLowerCase();
  if(v){const res=Object.values(LEADS).filter(l=>(l.name+" "+l.inn+" "+(l.fio||"")).toLowerCase().includes(v)).sort(byName);
    el.innerHTML=res.length?`<div class="lst">${res.map(l=>rowH(l,l.closed?{pill:["Архив","m"],rightB:"архив"}:{})).join("")}</div>`:`<p class="mut pad">Ничего не найдено.</p>`;return;}
  const d=todayData();
  if(SEG==="new"){el.innerHTML=newHtml(d.nw);return;}
  const {todayL,over,nod,soon,up,act}=d;
  let hero="";
  if(up){const hook=(up.hooks||[])[0],idx=todayL.indexOf(up)+1;
    hero=`<div class="hero"><div class="hh"><span class="dot"></span>СЛЕДУЮЩИЙ ЗВОНОК<small>${idx} из ${todayL.length} сегодня</small></div>
      <div class="big">${esc(up.nextTime||"Сегодня")}${up.nextTime?`<small>${esc(inTxt(up.nextTime))}</small>`:""}</div>
      <div class="hn">${esc(up.name)}</div><div class="hs">${esc([up.fio,tagTok(up.tag),stShort(up.status)[0]].filter(Boolean).join(" · "))}</div>
      <button class="btn" type="button" data-startcall="${esc(up.inn)}">Начать звонок</button></div>`+
      (hook?`<button class="petrol" type="button" data-open="${esc(up.inn)}" style="margin-top:10px"><b>Зацепка: ${esc(hook.t)}${hook.d?" · "+esc(dm(hook.d)):""}</b></button>`:"");
  } else hero=`<div class="hero"><div class="hh"><span class="dot" style="background:#444"></span><span class="mut">СЛЕДУЮЩИЙ ЗВОНОК</span></div>
      <div class="hn" style="font-size:22px;margin-top:10px">На сегодня звонков нет</div>
      ${over.length?`<div class="hs" style="margin:6px 0 0">Просрочено: ${over.length} <button class="lnk" type="button" data-filt="over">→ открыть</button></div>`:`<div class="hs" style="margin:6px 0 0">Добавь клиента кнопкой «Добавить».</div>`}</div>`;
  const cnt={today:todayL.length+nod.length,over:over.length};
  const chip=(k,t,n,red)=>`<button type="button" data-filt="${k}" class="${FILT===k?"on":""}">${t}${n!=null?` <b${red&&n>0&&FILT!==k?' class="r"':""}>${n}</b>`:""}</button>`;
  const chips=`<div class="chips">${chip("today","Сегодня",cnt.today)}${chip("over","Просрочено",cnt.over,true)}${chip("3d","3 дня")}${chip("all","Все")}</div>`;
  let list;
  if(FILT==="today")list=todayL.map(l=>rowH(l)).concat(nod.map(l=>rowH(l,{pill:["без даты","m"],rightB:"—"})));
  else if(FILT==="over")list=over.map(l=>rowH(l));
  else if(FILT==="3d")list=soon.map(l=>rowH(l));
  else list=act.slice().sort((a,b)=>(a.next||"9").localeCompare(b.next||"9")||byTime(a,b)).map(l=>rowH(l));
  el.innerHTML=hero+chips+`<div class="lst">${list.join("")||`<p class="mut pad">Здесь пока пусто.</p>`}</div>`;
}
function newHtml(nw){
  const lateN=nw.filter(l=>workdays(l.created||iso(today()),iso(today()))>NEW_LIMIT).length;
  const all=Object.values(LEADS),last=all.reduce((m,l)=>(l.created&&l.created>m?l.created:m),""),batch=all.filter(l=>l.created===last);
  const taken=batch.filter(l=>l.status!=="Новый клиент").length;
  const sorted=sortLeads(nw,SORT_NEW),shown=NEW_ALL?sorted:sorted.slice(0,8);
  const rows=shown.map(l=>{const n=workdays(l.created||iso(today()),iso(today())),late=n>NEW_LIMIT;
    const v=SORT_NEW;
    return rowH(l,{noPill:true,sub:[l.fio||"ФИО не указано",l.reg].filter(Boolean).join(" · "),
      rightB:(v==="rev"||v==="imp"||v==="exp")?FMT_B(l[v]):(n===0?"сегодня":n+" раб. дн."),
      rightS:(v==="rev"||v==="imp"||v==="exp")?sortCap(v):(late?"норма "+NEW_LIMIT:"")}).replace('class="rr"',late&&!(v==="rev"||v==="imp"||v==="exp")?'class="rr bad"':'class="rr"');}).join("");
  return `<h1 class="t">Новые клиенты</h1><p class="sub">${nw.length} ${pl(nw.length,["ждёт","ждут","ждут"])} подготовки${lateN?` · ${lateN} дольше нормы (${NEW_LIMIT} раб. дней)`:""}</p>
   ${last?`<div class="tiles two"><div class="tile"><small>Последняя загрузка</small><b>${esc(dm(last))} · ${batch.length} шт.</b></div><div class="tile"><small>Взято в работу</small><b>${taken} из ${batch.length}</b></div></div>`:""}
   <div class="chips">${SORTS.map(([k,t])=>`<button type="button" data-sortnew="${k}" class="${SORT_NEW===k?"on":""}">${t}</button>`).join("")}</div>
   <div class="lst">${rows||`<p class="mut pad">Новых клиентов нет. Загрузи список кнопкой вверху.</p>`}</div>
   ${nw.length>8?`<button class="gbtn more" type="button" data-newall>${NEW_ALL?"Свернуть":"Показать все "+nw.length}</button>`:""}`;
}

let FILT_CL="all";
const grp=l=>({"Новый клиент":"Новые","Сделать холодный звонок":"Звонок","Назначен 2-й звонок":"Звонок","Уточнить контакт":"Звонок","Назначена встреча":"Встреча","Назначена видео-встреча":"Встреча","Отправить КП":"КП","ХОЛД":"ХОЛД"}[l.status]||"Другое");

let ARCH_F="all",ARCH_OPEN=null;
function drawArchive(){
  const all=Object.values(LEADS).filter(l=>l.closed).sort((a,b)=>(b.closed.date||"").localeCompare(a.closed.date||""));
  const g=l=>l.closed.status.startsWith("Передан")?"В КП":l.closed.status;
  const cnt={};all.forEach(l=>{cnt[g(l)]=(cnt[g(l)]||0)+1;});
  if(ARCH_F!=="all"&&!cnt[ARCH_F])ARCH_F="all";
  const t=iso(today());
  SELVIS=all.filter(l=>ARCH_F==="all"||g(l)===ARCH_F).map(l=>l.inn);FILL=drawArchive;
  const rows=all.filter(l=>ARCH_F==="all"||g(l)===ARCH_F).map(l=>{
    const back=addDays(COOLDOWN_DAYS,l.closed.date),left=daysBetween(t,back),code=tagTok(l.tag)||(g(l)==="В КП"?"КП":"Отказ");
    const open=ARCH_OPEN===l.inn;
    if(SEL)return selRowH(l,left>0?"снова можно с "+dm(back):"можно вернуть в работу");
    return `<div><button class="row" type="button" data-archopen="${esc(l.inn)}"><span class="av">${esc(ini(l.name))}</span><span class="rm"><b>${esc(l.name)}</b><small>${esc(left>0?"снова можно с "+dm(back):"можно вернуть в работу")}</small></span><span class="rr"><b>${left>0?"через "+left+" дн":"готов"}</b></span>${pillH(code,g(l)==="В КП"?"g":"m")}</button>
     ${open?`<div class="step" style="flex-direction:column;align-items:stretch;gap:10px"><div><small>Итог · ${esc(ru(l.closed.date))}</small><b>${esc(l.closed.reason)}</b></div>
      <div style="display:flex;gap:8px"><button class="gbtn" style="flex:1" type="button" data-open="${esc(l.inn)}">Открыть карточку</button>${left>0?`<div class="gbtn" style="flex:1;opacity:.5">С ${esc(dm(back))}</div>`:`<button class="btn" style="flex:1;height:44px;font-size:14px" type="button" data-return="${esc(l.inn)}">Вернуть в работу</button>`}</div></div>`:""}</div>`;}).join("");
  main.innerHTML=headH(`<div class="hm">Архив · ${all.length}</div>`,SEL?`<button class="lnk" type="button" data-selcancel>Готово</button>`:(all.length?selBtn():""))+
   (all.length?`<div class="chips"><button type="button" data-archf="all" class="${ARCH_F==="all"?"on":""}">Все ${all.length}</button>${Object.keys(cnt).map(k=>`<button type="button" data-archf="${k}" class="${ARCH_F===k?"on":""}">${k} ${cnt[k]}</button>`).join("")}</div>`:"")+
   `<div class="lst">${rows||`<p class="mut pad">Закрытых клиентов пока нет. Отказ после звонка переносит клиента сюда.</p>`}</div>${SEL?selBar():""}`;
}
async function returnLead(inn){const l=LEADS[inn];if(!l||!l.closed)return;const back=addDays(COOLDOWN_DAYS,l.closed.date);
  if(iso(today())<back){toast("Снова можно с "+ru(back));return;}
  l.hist=l.hist||[];l.hist.push({d:iso(today()),st:"Возврат в работу",c:`после закрытия ${ru(l.closed.date)}: ${l.closed.reason}`});
  l.closed=null;l.status="Сделать холодный звонок";l.next=iso(today());l.nextTime="";l.nextWhat="первый звонок после возврата";
  await save(l);toast("Клиент вернулся в работу");TAB="today";CUR=null;SEG="calls";FILT="today";draw();}

     <div class="petrol" style="margin-top:14px;font-size:13px"><b>ГД / ФД</b> — генеральный / финансовый директор · <b>ВЭД</b> — внешнеэкономическая деятельность · <b>КП</b> — коммерческое предложение</div>`:
    `<div class="mp">${CHEAT_MAP.map(([a,b,c])=>`<div><b>${a}</b>${b}<small>${c}</small></div>`).join("")}</div>`;
  o.innerHTML=`<div class="ovin"><div class="head"><button class="ib" type="button" data-ovclose aria-label="Закрыть">${IC.x}</button><div class="seg" style="margin:0 auto"><button type="button" data-cheat="tags" class="${tab==="tags"?"on":""}">Теги</button><button type="button" data-cheat="map" class="${tab==="map"?"on":""}">Результат → статус</button></div><span style="width:42px"></span></div>
    <h1 class="t">Шпаргалка</h1>${body}<p class="demo">По регламенту клиентской работы (черновик 18.10.2026)</p></div>`;
  document.body.appendChild(o);
}

// ---------- Добавить клиента ----------
let ADDMODE="one",IMP=null;
const addSeg=()=>`<div class="head"><button class="ib" type="button" data-addclose aria-label="Закрыть">${IC.x}</button><div class="seg" style="margin:0 auto"><button type="button" data-addmode="one" class="${ADDMODE==="one"?"on":""}">Один клиент</button><button type="button" data-addmode="list" class="${ADDMODE==="list"?"on":""}">Список из Excel</button></div><span style="width:42px"></span></div>`;
function drawAdd(msg){
  if(ADDMODE==="list")return drawImport();
  main.innerHTML=addSeg()+`<h1 class="t">Новый клиент</h1><p class="sub">Статус «Новый клиент». Достаточно названия и ИНН.</p>
    <form novalidate id="addf">
      <div class="f"><label for="f_name">Компания</label><input id="f_name" required placeholder="ООО «Пример»"></div>
      <div class="f"><label for="f_inn">ИНН</label><input id="f_inn" inputmode="numeric" required pattern="\\d{10}|\\d{12}" placeholder="10 или 12 цифр"></div>
      <div class="f"><label for="f_fio">ФИО</label><input id="f_fio" placeholder="Иванов Иван Петрович"></div>
      <div class="f"><label for="f_pos">Должность</label><input id="f_pos" placeholder="Генеральный директор"></div>
      <div class="f"><label>Телефоны</label><div id="phs"><input class="ph" inputmode="tel" placeholder="8 900 000-00-00" aria-label="Телефон"></div></div>
      <button class="lnk" type="button" id="addph" style="margin-top:8px">+ ещё телефон</button>
      <div class="f"><label for="f_hook">Зацепка (необязательно)</label><input id="f_hook" placeholder="Например: импорт из Китая, выручка выросла вдвое"></div>
      <details class="mo"><summary>Клиент уже в работе? Статус, шаг и история</summary>
        <div class="f"><label for="f_st">Текущий статус</label><select id="f_st"><option>Новый</option><option>Сделать холодный звонок</option><option>Уточнить контакт</option><option>Назначен 2-й звонок</option><option>Назначена встреча</option><option>Назначена видео-встреча</option><option>Отправить КП</option><option>ХОЛД</option></select></div>
        <div class="f"><label for="f_nw">Следующий шаг</label><input id="f_nw" placeholder="Например: перезвонить по итогам письма"></div>
        <div class="f two"><div style="flex:1"><label for="f_nd">Дата</label><input id="f_nd" type="date"></div><div style="flex:1"><label for="f_nt">Время звонка</label><input id="f_nt" type="time"></div></div>
        <div class="f"><label for="f_hc">Что уже было</label><textarea id="f_hc" rows="3" placeholder="Кто, что сказал, о чём договорились"></textarea></div>
      </details>
      ${msg?`<div class="err">${msg}</div>`:""}
      <div class="bar"><button class="btn" type="submit">Добавить клиента</button></div>
    </form>`;
  document.getElementById("addph").onclick=()=>{const i=document.createElement("input");i.className="ph";i.inputMode="tel";i.placeholder="Ещё номер";i.setAttribute("aria-label","Телефон");i.style.marginTop="8px";document.getElementById("phs").appendChild(i);i.focus();};
  document.getElementById("addf").addEventListener("submit",async e=>{e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const inn=v("f_inn").replace(/\D/g,"");
    if(!v("f_name"))return drawAdd("Укажи название компании.");
    if(!/^(\d{10}|\d{12})$/.test(inn))return drawAdd("ИНН — 10 цифр для компании или 12 для ИП.");
    const ex=LEADS[inn];
    if(ex&&!ex.closed)return drawAdd(`Клиент уже в работе: <b>${esc(ex.name)}</b>. Открой его во вкладке «Клиенты».`);
    if(ex&&ex.closed){const back=addDays(COOLDOWN_DAYS,ex.closed.date);
      if(iso(today())<back)return drawAdd(`Клиент <b>${esc(ex.name)}</b> закрыт ${ru(ex.closed.date)} («${esc(ex.closed.reason)}»). Добавить снова можно с ${ru(back)}.`);}
    const l=ex||{inn,created:iso(today()),hist:[]};
    Object.assign(l,{name:v("f_name"),fio:v("f_fio"),pos:v("f_pos"),phones:[...document.querySelectorAll(".ph")].map(i=>i.value.trim()).filter(Boolean),phone:undefined,status:v("f_st")==="Новый"?"Новый клиент":v("f_st"),tag:"",next:v("f_nd")||(v("f_nt")?iso(today()):""),nextWhat:v("f_nw"),nextTime:v("f_nt"),closed:null});
    l.hooks=v("f_hook")?[{t:v("f_hook"),d:""}]:(l.hooks||[]);
    if(v("f_hc"))l.hist.push({d:iso(today()),st:"Занесено в Callex",c:v("f_hc")});
    if(ex)l.hist.push({d:iso(today()),st:"Возврат в работу",c:`после закрытия ${ru(ex.closed.date)}: ${ex.closed.reason}`});
    if(typeof l.ord!=="number")l.ord=Date.now()*1000;
    await save(l);toast("Клиент добавлен");CUR=inn;TAB="leads";draw();});
}
function drawImport(){
  const p=IMP,res=p&&p.res;
  let preview="";
  if(res&&res.err)preview=`<div class="err">${esc(res.err)}</div>`;
  else if(res){const c=res.cols,miss=x=>x&&x!=="—"?"«"+esc(x)+"»":"не найден";
    const n=res.added,u=res.upd;
    preview=`<h2 class="sh">Проверка перед загрузкой</h2><div class="kv">
      <div><span>Компания</span><span>${miss(c.name)}</span></div><div><span>ИНН</span><span>${miss(c.inn)}</span></div><div><span>ФИО</span><span>${miss(c.fio)}</span></div>
      <div><span>Телефоны</span><span>${c.ph.length?c.ph.map(x=>"«"+esc(x)+"»").join(", "):"не найдены"}</span></div>
      <div><span>Выручка</span><span>${miss(c.rev)}</span></div><div><span>Импорт</span><span>${miss(c.imp)}</span></div><div><span>Экспорт</span><span>${miss(c.exp)}</span></div></div>
      <div class="cnt"><span style="color:var(--ok)">Новых: ${n}</span><span class="mut">Уже есть: ${res.dup}</span>${u?`<span style="color:var(--acc)">Обновить: ${u}</span>`:""}<span class="${res.bad?"bad":"mut"}">Без ИНН: ${res.bad}</span></div>`;
  }
  const can=res&&!res.err&&(res.added>0||res.upd>0);
  const label=can?(res.added>0?`Добавить ${res.added} ${pl(res.added,["клиента","клиентов","клиентов"])}`+(res.upd?` и обновить ${res.upd}`:""):`Обновить данные: ${res.upd}`):"Добавить";
  main.innerHTML=addSeg()+`<h1 class="t">Загрузить базу</h1><p class="sub">Выбери файл Excel или вставь таблицу вместе со строкой заголовков. Дубли по ИНН не создаются, но дописываются выручка, импорт и экспорт.</p>
    <button class="drop" type="button" id="impfile">${IC.upload}<span>Выбрать файл Excel (.xlsx)</span></button><input type="file" id="impf" accept=".xlsx,.xls" hidden>
    <div class="f"><label for="imp">Или вставь таблицу</label><textarea id="imp" rows="4" placeholder="Скопированные из Excel строки"></textarea></div>
    <button class="gbtn" type="button" id="impcheck" style="margin-top:10px">Проверить вставленное</button>
    ${preview}
    <div class="bar"><button class="btn${can?"":" dis"}" type="button" id="impgo">${label}</button></div>`;
  const pick=document.getElementById("impf");
  document.getElementById("impfile").onclick=()=>pick.click();
  pick.onchange=async()=>{const f=pick.files&&pick.files[0];if(!f)return;
    try{toast("Читаю файл…");await loadXlsx();
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).map(r=>Array.from(r,c=>c==null?"":String(c))).filter(r=>r.some(x=>x.trim()!==""));
      const r=await runImport(rows,true);IMP={src:rows,res:r};drawImport();
    }catch(e){IMP={src:null,res:{err:"Не удалось прочитать файл ("+((e&&e.message)||e)+"). Можно вставить таблицу текстом."}};drawImport();}};
  document.getElementById("impcheck").onclick=async()=>{const t=document.getElementById("imp").value;if(!t.trim())return;const r=await runImport(t,true);IMP={src:t,res:r};drawImport();};
  document.getElementById("impgo").onclick=async()=>{if(!can||IMP.busy)return;IMP.busy=true;const bt=document.getElementById("impgo");bt.classList.add("dis");
    const r=await runImport(IMP.src,false,(d,n)=>{bt.textContent="Сохраняю… "+d+" из "+n;});IMP=null;
    toast(r.failed?("Сохранено с ошибками: не записалось "+r.failed+" из "+(r.added+r.upd)):"Добавлено: "+r.added+(r.upd?", обновлено: "+r.upd:""));ADDMODE="one";TAB="today";SEG="new";CUR=null;draw();};
}

// ---------- Приветствие ----------
function drawWelcome(){
  const prev=()=>{const n=document.getElementById("w_n").value.trim()||"[Имя]",p=document.getElementById("w_p").value.trim()||"[должность]",b=document.getElementById("w_b").value.trim()||"[банк]";return `«${esc(n)}, ${esc(p)}, ${esc(b)}. У вас есть две минуты?»`;};
  main.innerHTML=`<div class="wl"><h1>Call<span>ex</span></h1><h2>Привет! Пара слов о тебе</h2><p class="sub">Эти данные подставятся в готовые фразы для звонка. Можно пропустить и заполнить позже — тогда в фразах останутся [Имя], [банк], [должность].</p>
   <div class="f"><label for="w_n">Имя</label><input id="w_n" value="${esc(PROFILE.name||TGNAME)}" placeholder="Например: Георгий"></div>
   <div class="f"><label for="w_b">Банк</label><input id="w_b" value="${esc(PROFILE.bank)}" placeholder="Например: банк, где работаешь"></div>
   <div class="f"><label for="w_p">Должность</label><input id="w_p" value="${esc(PROFILE.pos)}" placeholder="Например: клиентский менеджер"></div>
   <div class="petrol" style="margin-top:16px"><i>ТАК ПРОЗВУЧИТ</i><span id="w_pv"></span></div></div>
   <div class="bar" style="flex-direction:column;gap:6px"><button class="btn" type="button" id="w_go" style="width:100%;height:52px;flex:none">Поехали</button><button type="button" id="w_skip" style="color:var(--mut);padding:8px;text-align:center;width:100%">Пропустить</button></div>`;
  const upd=()=>{document.getElementById("w_pv").innerHTML=prev();};upd();
  ["w_n","w_b","w_p"].forEach(id=>document.getElementById(id).addEventListener("input",upd));
  const fin=async keep=>{if(keep){PROFILE.name=document.getElementById("w_n").value.trim();PROFILE.bank=document.getElementById("w_b").value.trim();PROFILE.pos=document.getElementById("w_p").value.trim();}PROFILE.done=true;await saveProfile();draw();};
  document.getElementById("w_go").onclick=()=>fin(true);document.getElementById("w_skip").onclick=()=>fin(false);
}

// ===================== Навигация =====================
function pickList(q){const d=todayData(),seen=new Set(),out=[];
  [d.up,...d.todayL,...d.over,...d.nw,...d.nod,...d.soon,...d.act].forEach(l=>{if(l&&!seen.has(l.inn)){seen.add(l.inn);out.push(l);}});
  q=(q||"").trim().toLowerCase();
  const r=q?out.filter(l=>(l.name+" "+l.inn+" "+(l.fio||"")).toLowerCase().includes(q)):out;
  return {r:r.slice(0,40),all:r.length};}
function pickRows(q){const {r,all}=pickList(q),t=iso(today());
  return (r.map(l=>`<button class="opt" type="button" data-startcall="${esc(l.inn)}"><span>${esc(shortName(l.name))}<small>${esc([isNew(l)?"новый":(l.next?(l.next<t?"просрочен · ":"")+whenTxt(l):"без даты"),fioShort(l.fio)].filter(Boolean).join(" · "))}</small></span>${IC.chev}</button>`).join("")||`<p class="mut pad">Никого не нашли.</p>`)+(all>r.length?`<p class="mut pad">Показаны первые ${r.length} из ${all}. Уточни поиск.</p>`:"");}
// сохраняет прокрутку рядов чипов и показывает выбранный чип целиком
function kc(fn){const old=[...document.querySelectorAll(".chips")].map(c=>c.scrollLeft);fn();
  document.querySelectorAll(".chips").forEach((c,i)=>{if(old[i])c.scrollLeft=old[i];const on=c.querySelector(".on");if(!on)return;
    const cr=c.getBoundingClientRect(),r=on.getBoundingClientRect();
    if(r.left<cr.left)c.scrollLeft-=(cr.left-r.left)+14;else if(r.right>cr.right)c.scrollLeft+=(r.right-cr.right)+14;});}
function startNext(){closeOv();
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="sheet"><div class="hd"></div><div class="ph"><div><b>Кому звоним?</b><small>Выбери клиента или добавь нового</small></div></div>
    <button class="btn" type="button" data-picknew style="margin:14px 0 10px">+ Новый клиент</button>
    <div class="search">${IC.search}<input id="pk_q" placeholder="Компания, ИНН или ФИО" aria-label="Поиск"></div>
    <div class="opts" id="pk_l" style="margin-top:10px">${pickRows("")}</div></div>`;
  document.body.appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o)closeOv();});
  document.getElementById("pk_q").addEventListener("input",e=>{document.getElementById("pk_l").innerHTML=pickRows(e.target.value);});
}
function draw(){
  clearInterval(TM);closeOv();
  const welcome=!PROFILE.done&&!CALL&&!CUR;
  document.body.classList.toggle("deep",!!(CUR||CALL||TAB==="add"||welcome||SEL));
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===TAB&&!CALL&&!CUR)));
  if(welcome)return drawWelcome();
  if(CALL)return drawCall();
  if(CUR)return drawLead(CUR);
  ({today:drawToday,leads:()=>drawLeads(false),add:()=>drawAdd(),archive:()=>drawLeads(true)})[TAB]();
  window.scrollTo(0,0);
}
document.addEventListener("input",ev=>{const el=ev.target;if(el&&el.type==="date"&&el.value&&el.value>"2100-12-31"){el.value="";toast("Год не больше 2100");}});
document.addEventListener("click",ev=>{
  const c=sel=>ev.target.closest(sel);
  if(c("[data-ovclose]"))return closeOv();
  const ch=c("[data-cheat]");if(ch)return openCheat(ch.dataset.cheat||"tags");
  if(c("[data-profile]"))return openProfile();
  const tb=c(".tab[data-tab]");if(tb)return setTab(tb.dataset.tab);
  if(c("[data-act=call]"))return startNext();
  if(c("[data-askyes]")){const f=DEL_YES;DEL_YES=null;closeOv();if(f)f();return;}
  if(c("[data-selmode]")){SEL=new Set();return draw();}
  if(c("[data-selcancel]")){SEL=null;return draw();}
  const sr=c("[data-selrow]");if(sr){const k=sr.dataset.selrow;SEL.has(k)?SEL.delete(k):SEL.add(k);sr.querySelector(".ck").classList.toggle("on",SEL.has(k));return updSelBar();}
  if(c("[data-selall]")){const allOn=SELVIS.length&&SELVIS.every(x=>SEL.has(x));SELVIS.forEach(x=>allOn?SEL.delete(x):SEL.add(x));return FILL&&FILL();}
  if(c("[data-seldel]")){const ids=[...SEL].filter(x=>LEADS[x]);if(!ids.length)return;
    const nm=ids.slice(0,3).map(x=>shortName(LEADS[x].name)).join(", ")+(ids.length>3?" и ещё "+(ids.length-3):"");
    return askDel("Удалить "+ids.length+" "+pl(ids.length,["клиента","клиента","клиентов"])+"?",nm,async()=>{
      let pos=0,fail=0;const w=async()=>{while(pos<ids.length){const k=ids[pos++];try{await delLead(k);}catch{fail++;}}};
      await Promise.all([w(),w(),w(),w(),w()]);SEL=null;toast(fail?"Удалено с ошибками: "+fail:"Удалено: "+(ids.length-fail));draw();});}
  const dy=c("[data-delyes]");if(dy){const inn=dy.dataset.delyes,nm=(LEADS[inn]||{}).name||"";return delLead(inn).then(()=>{closeOv();CUR=null;CALL=null;toast("Удалено: "+nm);draw();});}
  if(c("[data-del]"))return confirmDel(CUR);
  if(c("[data-picknew]")){closeOv();ADDMODE="one";IMP=null;return setTab("add");}
  if(c("[data-imp]")){ADDMODE="list";IMP=null;return setTab("add");}
  if(c("[data-addclose]")){ADDMODE="one";IMP=null;return setTab("today");}
  const am=c("[data-addmode]");if(am){ADDMODE=am.dataset.addmode;IMP=null;return drawAdd();}
  const sg=c("[data-seg]");if(sg){SEG=sg.dataset.seg;QTXT="";return drawToday();}
  const fl=c("[data-filt]");if(fl){FILT=fl.dataset.filt;SEG="calls";QTXT="";return kc(drawToday);}
  const sn=c("[data-sortnew]");if(sn){SORT_NEW=sn.dataset.sortnew;return kc(fillToday);}
  if(c("[data-newall]")){NEW_ALL=!NEW_ALL;return kc(fillToday);}
  const cc=c("[data-chipcl]");if(cc){FILT_CL=cc.dataset.chipcl;return kc(()=>drawLeads(false));}
  const af=c("[data-archf]");if(af){ARCH_F=af.dataset.archf;return kc(drawArchive);}
  const ao=c("[data-archopen]");if(ao){ARCH_OPEN=ARCH_OPEN===ao.dataset.archopen?null:ao.dataset.archopen;return drawArchive();}
  const rt=c("[data-return]");if(rt)return returnLead(rt.dataset.return);
  const sc=c("[data-startcall]");if(sc)return startCall(sc.dataset.startcall);
  const op=c("[data-open]");if(op){CUR=op.dataset.open;CALL=null;EDIT_STEP=HOOK_F=PH_F=false;return draw();}
  if(c("[data-back]")){CUR=null;EDIT_STEP=HOOK_F=PH_F=false;return draw();}
  if(c("[data-editstep]")){EDIT_STEP=true;return drawLead(CUR);}
  if(c("[data-editcancel]")){EDIT_STEP=false;return drawLead(CUR);}
  if(c("[data-addph]")){PH_F=!PH_F;return drawLead(CUR);}
  if(c("[data-addhook]")){HOOK_F=!HOOK_F;return drawLead(CUR);}
  const cp=c("[data-copy]");if(cp&&cp.dataset.copy)return copy(cp.dataset.copy);
  if(c("[data-callclose]")){const inn=CALL.inn;CALL=null;CUR=inn;return draw();}
  if(CALL){
    const nx=c("[data-next]");
    if(nx){const th=nx.dataset.theme||CALL.hist[CALL.hist.length-1].theme;CALL.hist.push({id:nx.dataset.next,theme:th});drawCall();window.scrollTo(0,0);return;}
    if(c("[data-callback]")){if(CALL.hist.length>1){CALL.hist.pop();drawCall();}else{const inn=CALL.inn;CALL=null;CUR=inn;draw();}}
  }
});
(async()=>{
  if(TG){try{TG.setHeaderColor("#000000");TG.setBackgroundColor("#000000");}catch{}TG.ready();TG.expand();const u=TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u)TGNAME=u.first_name||"";}

`<button class="tab call" data-act="call" type="button"><i>${IC.phone}</i>Звонок</button>`+
