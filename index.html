<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#000;--s1:#121212;--s2:#1c1c1c;--s3:#262626;--fg:#fff;--mut:#7d7d7d;--acc:#f28a2e;--pet:#0b3a4f;--pet2:#06222f;--petfg:#cfe3ea;--petlb:#7fb4c6;--ok:#2fb36b;--bad:#e5484d;--line:#161616;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px))}
.app{max-width:640px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:var(--fg)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--mut)} .pad{padding:14px 4px} .bad{color:var(--bad)}
/* шапка */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 4px;min-height:52px}
.head .hm{font:700 17px Inter,sans-serif;flex:1;text-align:center}
.head .hr{display:flex;gap:6px;min-width:42px;justify-content:flex-end}
.avb{width:42px;height:42px;border-radius:50%;background:var(--s2);border:1.5px solid #333;display:grid;place-items:center;font:700 17px Inter,sans-serif;text-align:center}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.seg{display:flex;background:#141414;border-radius:999px;padding:3px;font:600 13px Inter,sans-serif}
.seg button{padding:7px 14px;border-radius:999px;color:#8a8a8a;text-align:center}
.seg button.on{background:#2b2b2b;color:#fff}
.seg b{color:var(--acc)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:999px;background:#141414;padding:0 14px;color:#777;margin:10px 0 0}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;font-size:15px}
.search input::placeholder{color:#777}
h1.t{font:700 28px/1.12 Inter,sans-serif;letter-spacing:-.02em;margin:16px 0 4px}

/* блоки */
.hero{margin:14px 0 0;border:1.5px solid #2a2a2a;border-radius:22px;padding:14px 16px}
.hero .hh{display:flex;align-items:center;gap:8px;font:700 12px Inter,sans-serif;letter-spacing:.08em;color:var(--acc)}
.hero .hh small{margin-left:auto;color:var(--mut);font:500 12px Inter,sans-serif;letter-spacing:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.hero .big{font:700 46px/1.05 Inter,sans-serif;letter-spacing:-.02em;margin-top:6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .big small{font:600 15px Inter,sans-serif;color:var(--acc);letter-spacing:0}
.hero .hn{font:600 19px/1.25 Inter,sans-serif;margin-top:8px}
.hero .hs{color:var(--mut);font-size:13px;margin:2px 0 12px}
.btn{display:grid;place-items:center;width:100%;height:50px;border-radius:999px;background:var(--acc);color:#140a02;font:700 16px Inter,sans-serif;text-align:center}

.gbtn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:999px;background:var(--s2);font:600 14px Inter,sans-serif;text-align:center;padding:0 16px}
.gbtn svg{width:18px;height:18px}
.petrol{background:linear-gradient(135deg,var(--pet),var(--pet2));border-radius:18px;padding:12px 16px;color:var(--petfg);font-size:14px;line-height:1.45;display:block;width:100%}

.petrol i{display:block;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:var(--petlb);margin-bottom:5px;font-style:normal}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -2px 4px;padding:0 2px;-webkit-overflow-scrolling:touch}

.chips button{white-space:nowrap;border-radius:999px;padding:7px 13px;font:600 14px Inter,sans-serif;background:#161616;color:#9a9a9a;flex:none}
.chips button.on{background:#fff;color:#000}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{background:#141414;border-radius:16px;padding:11px 12px;min-width:0}
.tile small{display:block;color:var(--mut);font-size:11.5px;line-height:1.25}
.tile b{display:block;font:700 18px Inter,sans-serif;margin-top:3px;white-space:nowrap}
.tile em{display:block;font-style:normal;font-size:11.5px;margin-top:2px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile em.ok{color:var(--ok)} .tile em.warn{color:var(--bad)} .tile em.acc{color:var(--acc)}
/* строки списка */

.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;font:700 12px Inter,sans-serif;flex:none}
.rm{flex:1;min-width:0}
.rm b{display:block;font:600 15px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right;flex:none}
.rr b{display:block;font:600 14px Inter,sans-serif;font-variant-numeric:tabular-nums}
.rr small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.rr.bad b{color:var(--bad)}
.pill{flex:none;min-width:84px;height:30px;padding:0 10px;border-radius:8px;display:grid;place-items:center;font:600 12px Inter,sans-serif;white-space:nowrap}
.p-o{background:var(--acc);color:#1a0d02}.p-m{background:#262626;color:#cfcfcf}.p-r{background:var(--bad);color:#fff}.p-g{background:var(--ok);color:#03140a}

/* нижнее меню */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px));background:#000;border-top:1px solid var(--line);z-index:5;padding:9px 6px env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10.5px Inter,sans-serif;color:#6f6f6f;text-align:center}
.tab[aria-current="true"]{color:#fff}
.tab.call i{width:50px;height:50px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;margin-top:-6px;box-shadow:0 0 0 5px #000}
.tab.call svg{width:24px;height:24px;stroke-width:2}

.bdg{position:absolute;top:-3px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px Inter,sans-serif;text-align:center;box-shadow:0 0 0 2px #000}
.due{background:linear-gradient(90deg,rgba(229,72,77,.14),transparent 80%);box-shadow:inset 3px 0 0 var(--bad)}.due .row{padding-left:12px}
/* нижняя панель действий */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,#000 70%,rgba(0,0,0,0));z-index:4}
.bar>*{max-width:640px}
.bar .btn{flex:1}
.bar .rb{width:50px;height:50px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
/* карточка клиента */
.back{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
h1.cn{font:700 28px/1.12 Inter,sans-serif;letter-spacing:-.02em;margin:8px 0 4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{font:600 12px Inter,sans-serif;background:#1c1c1c;border-radius:999px;padding:5px 10px}
.step{background:#141414;border-radius:16px;padding:12px 14px;margin-top:10px;display:flex;gap:10px;align-items:center}
.step small{display:block;color:var(--mut);font-size:12px}
.step b{display:block;font:600 15px/1.3 Inter,sans-serif;margin-top:2px}
.step .lnk{margin-left:auto;flex:none}
.lnk{color:var(--acc);font:600 14px Inter,sans-serif;white-space:nowrap}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 6px}
.sec h3{margin:0;font:700 18px Inter,sans-serif}
.hk{margin-top:8px}
.hk .petrol{display:flex;align-items:center;gap:10px;padding:11px 14px}
.hk .petrol span{flex:1}
.x{color:#7fb4c6;font:600 18px Inter,sans-serif;padding:0 4px;flex:none}
.cr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cr>div{flex:1;min-width:0}

.cr small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}

.cr .ic.call{color:var(--acc)}
.hs2 div{margin-top:12px;font-size:15px}
.hs2 small{display:block;color:var(--mut);margin-top:2px}
.note{background:#1a1410;border-radius:14px;padding:11px 14px;margin-top:12px;font-size:14px}
/* формы */
.f{margin-top:12px}
.f label{display:block;color:var(--mut);font:500 12px Inter,sans-serif;margin:0 0 6px 4px}
.f input,.f textarea,.f select{width:100%;min-width:0;background:#141414;border:0;border-radius:14px;padding:0 16px;height:48px;font-size:15px;outline:0;-webkit-appearance:none;appearance:none}

.f input[type=date],.f input[type=time]{display:flex;align-items:center;text-align:left;line-height:normal;min-height:48px}

.f.sm input,.f.sm select{height:42px;border-radius:12px;font-size:14px}
.f.two,.f .two{display:flex;gap:10px;align-items:flex-start}.f.two[hidden]{display:none}.f.two>div{min-width:0}

.err{background:#1a1410;border-radius:14px;padding:11px 14px;margin-top:12px;font-size:14px}
.sorts{display:flex;align-items:center;gap:6px;margin:10px 0 0;color:var(--mut);font-size:13px}
.sorts select{background:none;border:0;color:var(--fg);font:600 13px Inter,sans-serif;-webkit-appearance:none;appearance:none;padding:4px 18px 4px 2px;outline:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a8a8a' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 3px center}
.drop{display:grid;place-items:center;gap:8px;text-align:center;width:100%;margin-top:16px;padding:26px 16px;border:1.5px dashed #333;border-radius:18px;color:#8a8a8a;font:500 14px/1.45 Inter,sans-serif}

.kv{background:#141414;border-radius:16px;padding:2px 14px;margin-top:8px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1e1e1e;font:500 14px Inter,sans-serif}
.kv div:last-child{border:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.cnt{display:flex;gap:16px;padding:12px 2px 0;font:600 14px Inter,sans-serif}
/* звонок */
.ch{display:flex;align-items:center;gap:6px;padding:4px 0;min-height:48px}
.ch .ct{flex:1;text-align:center;font:600 16px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .tm{color:var(--acc);font:600 15px Inter,sans-serif;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pl .num{display:flex;align-items:center;gap:8px;font:600 18px Inter,sans-serif}
.pl .num svg{width:20px;height:20px;color:#bbb}
.pl .hkb{background:var(--pet);color:#cfe3ea;border-radius:999px;padding:6px 12px;font:500 12.5px Inter,sans-serif;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:6px;margin:12px 0 10px}
.prog i{flex:1;height:3px;border-radius:2px;background:#2a2a2a}
.prog i.on{background:var(--acc)}
.path{color:var(--mut);font-size:13px}
.q{font:700 27px/1.15 Inter,sans-serif;letter-spacing:-.02em;margin:12px 0 14px}
.say{background:linear-gradient(135deg,var(--pet),var(--pet2));border-radius:18px;padding:14px 16px;color:var(--petfg);margin:0 0 14px}
.say i{display:block;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:var(--petlb);margin-bottom:6px;font-style:normal;text-transform:uppercase}

.opts{display:flex;flex-direction:column;gap:8px}

.opt svg{width:18px;height:18px;color:#777}

.cf{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:var(--mut);font:500 15px Inter,sans-serif}
.cf button{color:var(--mut);display:flex;align-items:center;gap:4px}

/* итог */
h2.sh{font:700 18px Inter,sans-serif;margin:20px 0 10px}
.tc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}

.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.gr button{height:56px;border-radius:14px;background:#1c1c1c;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 14.5px Inter,sans-serif;text-align:center;padding:0 4px}
.gr button small{font:500 11px Inter,sans-serif;color:#7d7d7d}
.gr button.on{background:#fff;color:#000}
.gr button.on small{color:#555}
/* оверлеи */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.full{background:#000;align-items:stretch;overflow-y:auto}
.sheet{background:#121212;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}

.mp{display:grid;gap:2px;margin-top:8px}

.demo{font-size:12px;color:var(--mut);text-align:center;margin:20px 0 0}
.wl h1{font:800 40px/1.05 Inter,sans-serif;letter-spacing:-.03em;margin:44px 0 18px}
.wl h1 span{color:var(--acc)}
.wl h2{font:700 27px/1.15 Inter,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
@media (min-width:900px){.app,.tabs-in,.bar>*{max-width:760px}body{font-size:16px}.app{max-width:760px}}

.bar .btn{height:52px}
.btn,.gbtn{flex-shrink:0}

.ck{width:24px;height:24px;border-radius:50%;border:2px solid #555;flex:none;display:grid;place-items:center;margin-right:2px}.ck.on{background:var(--acc);border-color:var(--acc)}.ck.on:after{content:"✓";color:#140a02;font-weight:800;font-size:14px;line-height:1}

.phr{display:flex;gap:8px;align-items:center;margin-top:8px}.phr input{flex:1}.xph{width:42px;height:42px;border-radius:50%;background:var(--s2);border:0;color:var(--fg);display:grid;place-items:center;flex:none;padding:0;cursor:pointer}.xph svg{width:18px;height:18px}

<div id="splash" aria-hidden="true"><svg viewBox="0 0 400 400"><path id="sp-c" d="" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/><circle id="sp-d" cx="292" cy="200" r="26" fill="#ff8a00" stroke="none"/></svg></div>
<script>
(function(){
  var sp=document.getElementById("splash"); if(!sp) return;
  var C=document.getElementById("sp-c"), D=document.getElementById("sp-d");
  var CX=200,CY=200,R=92,SW=34,DELTA=32,LOW=-318,UP=-42;
  function bez(x1,y1,x2,y2){return function(x){var lo=0,hi=1,t;for(var i=0;i<30;i++){t=(lo+hi)/2;var xx=3*(1-t)*(1-t)*t*x1+3*(1-t)*t*t*x2+t*t*t;if(xx<x)lo=t;else hi=t;}t=(lo+hi)/2;return 3*(1-t)*(1-t)*t*y1+3*(1-t)*t*t*y2+t*t*t;};}
  var E=bez(.45,0,.25,1);
  function pt(a){a=a*Math.PI/180;return [CX+R*Math.cos(a),CY+R*Math.sin(a)];}
  function draw(th,lo,hi){
    var p=pt(th); D.setAttribute("cx",p[0].toFixed(2)); D.setAttribute("cy",p[1].toFixed(2));
    var ln=hi-lo;
    if(ln<=0.2){C.setAttribute("d","");return;}
    var a=pt(hi), b=pt(lo);
    C.setAttribute("d","M "+a[0].toFixed(2)+" "+a[1].toFixed(2)+" A "+R+" "+R+" 0 "+(ln>180?1:0)+" 0 "+b[0].toFixed(2)+" "+b[1].toFixed(2));
    C.setAttribute("stroke-width",(SW*Math.min(1,ln/22)).toFixed(2));
  }
  var HOLD=200, OUT=1200, REST=120, IN=1200, END=200, T=HOLD+OUT+REST+IN+END;
  var t0=null, gone=false;
  function frame(th){ return th; }
  function render(ms){
    var th,lo=LOW,hi=UP;
    if(ms<HOLD){th=0;}
    else if(ms<HOLD+OUT){th=-360*E((ms-HOLD)/OUT); hi=Math.min(UP,th-DELTA);}
    else if(ms<HOLD+OUT+REST){th=-360; hi=lo;}
    else if(ms<HOLD+OUT+REST+IN){th=-360*E((ms-HOLD-OUT-REST)/IN); lo=Math.max(LOW,th+DELTA);}
    else {th=-360;}
    draw(th,lo,hi);
  }
  function hide(){ if(gone) return; gone=true; sp.classList.add("off"); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },500); }
  var reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  if(reduce){ render(0); setTimeout(hide,500); }
  else {
    render(0);
    (function tick(now){
      if(gone) return;
      if(t0===null) t0=now;
      var ms=now-t0; render(Math.min(ms,T-1));
      if(ms>=T) hide(); else requestAnimationFrame(tick);
    })(performance.now());
  }
  sp.addEventListener("click",hide);
  setTimeout(hide,T+1500);
})();
</script>

// ===================== Хранилище: облако Telegram, иначе браузер =====================
const TG = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) ? Telegram.WebApp : null;
const CS = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9") ? TG.CloudStorage : null;
const mem = {};
const store = {
  keys(){ return new Promise(res => { if (CS) return CS.getKeys((e,k)=>res(e?[]:k||[]));
    try { res(Object.keys(localStorage).filter(k=>k.startsWith("cx_")).map(k=>k.slice(3))); } catch { res(Object.keys(mem)); } }); },
  get(keys){ return new Promise(res => { if (CS) return CS.getItems(keys,(e,v)=>res(e?{}:v||{}));
    const o={}; for (const k of keys){ try { o[k]=localStorage.getItem("cx_"+k); } catch { o[k]=mem[k]; } } res(o); }); },
  set(k,v){ return new Promise(res => { if (CS) return CS.setItem(k,v,(e,ok)=>res(!e && ok!==false));
    try { localStorage.setItem("cx_"+k,v); } catch { mem[k]=v; } res(true); }); },
};
let LEADS = {};               // inn -> lead
let COOLDOWN_DAYS = 14;
const HIST_MAX = 12;          // история обрезается, чтобы запись влезала в 4096 символов облака Telegram
async function loadAll(){
  const ks = (await store.keys()).filter(k=>k.startsWith("lead_"));
  const vals = ks.length ? await store.get(ks) : {};
  LEADS = {}; for (const k of ks){ try { const l = JSON.parse(vals[k]); if (l && l.inn) LEADS[l.inn]=l; } catch {} }
}
async function save(l){
  l.hist = (l.hist||[]).slice(-HIST_MAX);
  let s = JSON.stringify(l);
  while (s.length > 4000 && l.hist.length > 1){ l.hist.shift(); s = JSON.stringify(l); }
  LEADS[l.inn] = l; return await store.set("lead_"+l.inn, s);
}

// ===================== Даты и формат =====================
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (n, from) => { const d = from ? new Date(from+"T00:00:00") : today(); d.setDate(d.getDate()+n); return iso(d); };
const ru = s => s ? s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4) : "—";
const phonesOf = l => (l.phones && l.phones.length) ? l.phones : (l.phone ? [l.phone] : []);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/864e5);
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("Скопировано"); }
  catch { const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Скопировано");}catch{toast("Выдели текст и скопируй вручную");} ta.remove(); } }
function openLink(u){ if (TG && TG.openLink) TG.openLink(u); else window.open(u,"_blank","noopener"); }
function calUrl(l, date, what){
  let d = date.replace(/-/g,""), d2 = addDays(1,date).replace(/-/g,"");
  if (l.nextTime && date===l.next){ const [h,m]=l.nextTime.split(":").map(Number), e=new Date(date+"T00:00:00"); e.setHours(h,m+30);
    const pad=n=>String(n).padStart(2,"0"); d = date.replace(/-/g,"")+"T"+pad(h)+pad(m)+"00";
    d2 = iso(e).replace(/-/g,"")+"T"+pad(e.getHours())+pad(e.getMinutes())+"00"; }
  const text = `${what}: ${l.name}`;
  const details = [`ИНН ${l.inn}`, l.fio ? `${l.fio}${l.pos?", "+l.pos:""}` : "", l.tag ? `Тег: ${l.tag}` : "", ...(l.hooks||[]).map(h=>"Зацепка: "+h.t+(h.d?" ("+ru(h.d)+")":""))].filter(Boolean).join("\n");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${d}/${d2}&details=${encodeURIComponent(details)}`;
}

function parseTSV(text){ // табличный текст из Excel: столбцы через таб, ячейки с переносами — в кавычках
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if (c==='"' && cell==="") q=true;
    else if (c==="\t"){ row.push(cell); cell=""; }
    else if (c==="\n" || c==="\r"){ if (c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  if (cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function phonesFrom(txt){ return String(txt||"").split(/[,;\n]+/).map(x=>x.trim()).filter(x=>(x.match(/\d/g)||[]).length>=10); }
const FMT_B = v => (typeof v==="number" && isFinite(v) && v>=0.005) ? v.toFixed(2).replace(".",",")+" млрд ₽" : "—";
function numFrom(x){ if (typeof x==="number") return isFinite(x)?x:null;
  let s=String(x==null?"":x).replace(/[\s\u00a0]/g,""); s = /^\d{1,3}(,\d{3}){2,}(\.\d+)?$/.test(s) ? s.replace(/,/g,"") : s.replace(",","."); if(!s||!/^-?[\d.]+(e[+-]?\d+)?$/i.test(s)) return null;
  const n=Number(s); return isFinite(n)?n:null; }
function unitB(h, dflt){ h=(h||"").toLowerCase(); if(/млрд/.test(h)) return 1; if(/млн/.test(h)) return 1e-3; if(/тыс/.test(h)) return 1e-6; return dflt; }   // множитель к млрд
let XLSX_P=null;
function loadXlsx(){ if (window.XLSX) return Promise.resolve();
  if (!XLSX_P) XLSX_P = new Promise((ok,no)=>{ const s=document.createElement("script");

    s.onerror=()=>{ XLSX_P=null; no(new Error("не загрузилась библиотека чтения Excel")); }; document.head.appendChild(s); });
  return XLSX_P; }
function importList(text){ return importRows(parseTSV(text)); }
function importRows(all){
  const hi = all.slice(0,3).findIndex(r=>r.some(c=>c.trim().toLowerCase()==="инн"));   // строка заголовков (бывает вторая)
  if (hi<0 || all.length<hi+2) return {err:"Не нашёл строку заголовков со столбцом «ИНН» или данные под ней. Скопируй из Excel вместе с заголовками."};
  const raw = all[hi].map(h=>h.trim()), hdr = raw.map(h=>h.toLowerCase());
  const iName = hdr.findIndex(h=>h.includes("компани")||h.includes("наименование"));
  const iInn = hdr.findIndex(h=>h==="инн");            // первый столбец ИНН — компания
  const iFio = hdr.findIndex(h=>h.includes("фио"));
  const iPh = hdr.map((h,i)=>(/(тел|номер|контакт|моб|phone|альтернатив)/.test(h) && !/(инн|фио|почт|mail|адрес|сайт)/.test(h) && !(/лпр/.test(h) && !/(номер|тел|моб)/.test(h)) && i!==iName && i!==iFio)?i:-1).filter(i=>i>=0);
  const iRev = hdr.findIndex(h=>/выруч/.test(h)), iImp = hdr.findIndex(h=>/импорт/.test(h)), iExp = hdr.findIndex(h=>/экспорт/.test(h)), iReg = hdr.findIndex(h=>/(област|регион)/.test(h));

async function runImport(src,dry,prog){

    if (r.iImp>=0){ const v=numFrom(row[r.iImp]); if (v!=null) ex.imp=v*r.uImp; }
    if (r.iExp>=0){ const v=numFrom(row[r.iExp]); if (v!=null) ex.exp=v*r.uExp; }
    if (r.iReg>=0){ const g=String(row[r.iReg]||"").trim(); if (g && !/^(москва|московская)/i.test(g)) ex.reg=g; }
    if(seen.has(inn)){dup++;continue;} seen.add(inn);
    const old = LEADS[inn];
    if (old){ let ch=false; for (const k of ["rev","imp","exp","reg","ord"]) if (ex[k]!==undefined && old[k]===undefined){ if(!dry) old[k]=ex[k]; ch=true; }
      if (ch){ if(!dry) todo.push(old); upd++; } else dup++; continue; }

    added++;
  }
  let done=0, failed=0, pos=0;
  const worker=async()=>{ while(pos<todo.length){ const l=todo[pos++]; let ok=false; try{ ok=await save(l); }catch{} if(!ok) failed++; done++; if(prog) prog(done,todo.length); } };
  if(!dry) await Promise.all(Array.from({length:Math.min(5,todo.length)},worker));
  return {added, dup, upd, bad, failed, cols:r.cols};
}

const isGD=r=>/^(гд|ген)/i.test(r||""),isFD=r=>/^(фд|фин)/i.test(r||"");
const ctsOf=l=>[{k:0,role:l.pos||"Генеральный директор",fio:l.fio||"",phones:phonesOf(l)}].concat((l.cs||[]).map((c,i)=>({k:i+1,role:c.role||"",fio:c.fio||"",phones:c.phones||[]})));
function setCt(l,k,p){if(k===0){if("role"in p)l.pos=p.role;if("fio"in p)l.fio=p.fio;if("phones"in p){l.phones=p.phones;delete l.phone;}}
  else{l.cs=l.cs||[];const c=l.cs[k-1];if(c){if("role"in p)c.role=p.role;if("fio"in p)c.fio=p.fio;if("phones"in p)c.phones=p.phones;}}}
// контакт, к которому относится текущий шаг звонка
function ctForNode(l,hist){const cs=ctsOf(l);
  // с кем говорим — по последнему шагу пути, где это стало ясно (ГД или ФД)
  const MAP={gd:isGD,gdAsk:isGD,fd:isFD,gdfd:isFD,gdfdLater:isFD,gotContact:isFD};
  // ручной выбор контакта (плашка в шапке звонка) действует, пока дальше по пути не появился шаг ГД/ФД
  if(CALL&&hist===CALL.hist&&CALL.ct!=null&&cs[CALL.ct]&&!hist.some((h,i)=>i>=CALL.ctAt&&MAP[h.id]))return cs[CALL.ct];
  let want=null;for(let i=hist.length-1;i>=0;i--){if(MAP[hist[i].id]){want=MAP[hist[i].id];break;}}
  return (want&&cs.find(c=>want(c.role)&&c.phones.length))||cs.find(c=>c.phones.length)||cs[0];}

        <div class="f"><label for="f_st">Текущий статус</label><select id="f_st"><option>Новый</option><option>Сделать холодный звонок</option><option>Уточнить контакт</option><option>Назначен 2-й звонок</option><option>Назначена встреча</option><option>Назначена видео-встреча</option><option>Отправить КП</option><option>ХОЛД</option></select></div>

        <div class="f"><label for="f_hc">Что уже было</label><textarea id="f_hc" rows="3" placeholder="Кто, что сказал, о чём договорились"></textarea></div>
      </details>
      <div id="adderr">${msg?`<div class="err">${msg}</div>`:""}</div>
      <div class="bar"><button class="btn" type="submit">Добавить клиента</button></div>
    </form>`;
  document.getElementById("addph").onclick=()=>{
    const empty=[...document.querySelectorAll("#phs .ph")].find(i=>!i.value.trim());
    if(empty){empty.focus();return;}   // пустое поле уже есть — новое не добавляем
    const r=document.createElement("div");r.className="phr";

  document.getElementById("addf").addEventListener("submit",async e=>{e.preventDefault();try{

function drawImport(){
  const p=IMP,res=p&&p.res;
  let preview="";
  if(res&&res.err)preview=`<div class="err">${esc(res.err)}</div>`;
  else if(res){const c=res.cols,miss=x=>x&&x!=="—"?"«"+esc(x)+"»":"не найден";
    const n=res.added,u=res.upd;
    preview=`<h2 class="sh">Проверка перед загрузкой</h2><div class="kv">
      <div><span>Компания</span><span>${miss(c.name)}</span></div><div><span>ИНН</span><span>${miss(c.inn)}</span></div><div><span>ФИО</span><span>${miss(c.fio)}</span></div>
      <div><span>Телефоны</span><span>${c.ph.length?c.ph.map(x=>"«"+esc(x)+"»").join(", "):"не найдены"}</span></div>
      <div><span>Выручка</span><span>${miss(c.rev)}</span></div><div><span>Импорт</span><span>${miss(c.imp)}</span></div><div><span>Экспорт</span><span>${miss(c.exp)}</span></div></div>
      <div class="cnt"><span style="color:var(--ok)">Новых: ${n}</span><span class="mut">Уже есть: ${res.dup}</span>${u?`<span style="color:var(--acc)">Обновить: ${u}</span>`:""}<span class="${res.bad?"bad":"mut"}">Без ИНН: ${res.bad}</span></div>`;
  }
  const can=res&&!res.err&&(res.added>0||res.upd>0);
  const label=can?(res.added>0?`Добавить ${res.added} ${pl(res.added,["клиента","клиентов","клиентов"])}`+(res.upd?` и обновить ${res.upd}`:""):`Обновить данные: ${res.upd}`):"Добавить";
  main.innerHTML=addSeg()+`<h1 class="t">Загрузить базу</h1><p class="sub">Выбери файл Excel или вставь таблицу вместе со строкой заголовков. Дубли по ИНН не создаются, но дописываются выручка, импорт и экспорт.</p>
    <button class="drop" type="button" id="impfile">${IC.upload}<span>Выбрать файл Excel (.xlsx)</span></button><input type="file" id="impf" accept=".xlsx,.xls" hidden>
    <div class="f"><label for="imp">Или вставь таблицу</label><textarea id="imp" rows="4" placeholder="Скопированные из Excel строки"></textarea></div>
    <button class="gbtn" type="button" id="impcheck" style="margin-top:10px">Проверить вставленное</button>
    ${preview}
    <div class="bar"><button class="btn${can?"":" dis"}" type="button" id="impgo">${label}</button></div>`;
  const pick=document.getElementById("impf");
  document.getElementById("impfile").onclick=()=>pick.click();
  pick.onchange=async()=>{const f=pick.files&&pick.files[0];if(!f)return;
    try{toast("Читаю файл…");await loadXlsx();
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).map(r=>Array.from(r,c=>c==null?"":String(c))).filter(r=>r.some(x=>x.trim()!==""));
      const r=await runImport(rows,true);IMP={src:rows,res:r};drawImport();
    }catch(e){IMP={src:null,res:{err:"Не удалось прочитать файл ("+((e&&e.message)||e)+"). Можно вставить таблицу текстом."}};drawImport();}};
  document.getElementById("impcheck").onclick=async()=>{const t=document.getElementById("imp").value;if(!t.trim())return;const r=await runImport(t,true);IMP={src:t,res:r};drawImport();};
  document.getElementById("impgo").onclick=async()=>{if(!can||IMP.busy)return;IMP.busy=true;const bt=document.getElementById("impgo");bt.classList.add("dis");
    const r=await runImport(IMP.src,false,(d,n)=>{bt.textContent="Сохраняю… "+d+" из "+n;});IMP=null;
    toast(r.failed?("Сохранено с ошибками: не записалось "+r.failed+" из "+(r.added+r.upd)):"Добавлено: "+r.added+(r.upd?", обновлено: "+r.upd:""));ADDMODE="one";TAB="today";SEG="new";CUR=null;draw();};
}

  main.innerHTML=`<div class="wl"><h1>Call<span>ex</span></h1><h2>Привет! Пара слов о тебе</h2><p class="sub">Эти данные подставятся в готовые фразы для звонка. Можно пропустить и заполнить позже — тогда в фразах останутся [Имя], [банк], [должность].</p>

   <div class="bar" style="flex-direction:column;gap:6px"><button class="btn" type="button" id="w_go" style="width:100%;height:52px;flex:none">Поехали</button><button type="button" id="w_skip" style="color:var(--mut);padding:8px;text-align:center;width:100%">Пропустить</button></div>`;

// ===================== Навигация =====================
function pickList(q){const d=todayData(),seen=new Set(),out=[];
  [d.up,...d.todayL,...d.over,...d.nw,...d.nod,...d.soon,...d.act].forEach(l=>{if(l&&!seen.has(l.inn)){seen.add(l.inn);out.push(l);}});
  q=(q||"").trim().toLowerCase();
  const r=q?out.filter(l=>matchQ(l,q)):out;
  return {r:r.slice(0,40),all:r.length};}
function pickRows(q){const {r,all}=pickList(q),t=iso(today());
  return (r.map(l=>`<button class="opt" type="button" data-startcall="${esc(l.inn)}"><span>${esc(shortName(l.name))}<small>${esc([isNew(l)?"новый":(l.next?(l.next<t?"просрочен · ":"")+whenTxt(l):"без даты"),fioShort(l.fio)].filter(Boolean).join(" · "))}</small></span>${IC.chev}</button>`).join("")||`<p class="mut pad">Никого не нашли.</p>`)+(all>r.length?`<p class="mut pad">Показаны первые ${r.length} из ${all}. Уточни поиск.</p>`:"");}
// сохраняет прокрутку рядов чипов и показывает выбранный чип целиком
function kc(fn){const old=[...document.querySelectorAll(".chips")].map(c=>c.scrollLeft);fn();
  document.querySelectorAll(".chips").forEach((c,i)=>{if(old[i])c.scrollLeft=old[i];const on=c.querySelector(".on");if(!on)return;
    const cr=c.getBoundingClientRect(),r=on.getBoundingClientRect();
    if(r.left<cr.left)c.scrollLeft-=(cr.left-r.left)+14;else if(r.right>cr.right)c.scrollLeft+=(r.right-cr.right)+14;});}
function startNext(){closeOv();
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="sheet"><div class="hd"></div><div class="ph"><div><b>Кому звоним?</b><small>Выбери клиента или добавь нового</small></div></div>
    <button class="btn" type="button" data-picknew style="margin:14px 0 10px">+ Новый клиент</button>
    <div class="search">${IC.search}<input id="pk_q" placeholder="Компания, ИНН, ФИО или телефон" aria-label="Поиск"></div>
    <div class="opts" id="pk_l" style="margin-top:10px">${pickRows("")}</div></div>`;
  document.body.appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o)closeOv();});
  document.getElementById("pk_q").addEventListener("input",e=>{document.getElementById("pk_l").innerHTML=pickRows(e.target.value);});
}
function draw(){
  clearInterval(TM);closeOv();
  const welcome=!PROFILE.done&&!CALL&&!CUR;
  document.body.classList.toggle("deep",!!(CUR||CALL||TAB==="add"||welcome||SEL));
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===TAB&&!CALL&&!CUR)));updBadge();
  if(welcome)return drawWelcome();
  if(CALL)return drawCall();
  if(CUR)return drawLead(CUR);
  ({today:drawToday,leads:()=>drawLeads(false),add:()=>drawAdd(),archive:()=>drawLeads(true)})[TAB]();
  window.scrollTo(0,0);
}
document.addEventListener("input",ev=>{const el=ev.target;if(el&&el.type==="date"&&el.value&&el.value>"2100-12-31"){el.value="";toast("Год не больше 2100");}});
document.addEventListener("click",ev=>{
  const c=sel=>ev.target.closest(sel);
  if(c("[data-ovclose]"))return closeOv();
  const ch=c("[data-cheat]");if(ch)return openCheat(ch.dataset.cheat||"tags");
  if(c("[data-profile]"))return openProfile();
  const tb=c(".tab[data-tab]");if(tb)return setTab(tb.dataset.tab);
  if(c("[data-act=call]"))return startNext();
  if(c("[data-askyes]")){const f=DEL_YES;DEL_YES=null;closeOv();if(f)f();return;}
  if(c("[data-selmode]")){SEL=new Set();return draw();}
  if(c("[data-selcancel]")){SEL=null;return draw();}
  const sr=c("[data-selrow]");if(sr){const k=sr.dataset.selrow;SEL.has(k)?SEL.delete(k):SEL.add(k);sr.querySelector(".ck").classList.toggle("on",SEL.has(k));return updSelBar();}
  if(c("[data-selall]")){const allOn=SELVIS.length&&SELVIS.every(x=>SEL.has(x));SELVIS.forEach(x=>allOn?SEL.delete(x):SEL.add(x));return FILL&&FILL();}
  if(c("[data-seldel]")){const ids=[...SEL].filter(x=>LEADS[x]);if(!ids.length)return;
    const nm=ids.slice(0,3).map(x=>shortName(LEADS[x].name)).join(", ")+(ids.length>3?" и ещё "+(ids.length-3):"");
    return askDel("Удалить "+ids.length+" "+pl(ids.length,["клиента","клиента","клиентов"])+"?",nm,async()=>{
      let pos=0,fail=0;const w=async()=>{while(pos<ids.length){const k=ids[pos++];try{await delLead(k);}catch{fail++;}}};
      await Promise.all([w(),w(),w(),w(),w()]);SEL=null;toast(fail?"Удалено с ошибками: "+fail:"Удалено: "+(ids.length-fail));draw();});}
  const dy=c("[data-delyes]");if(dy){const inn=dy.dataset.delyes,nm=(LEADS[inn]||{}).name||"";return delLead(inn).then(()=>{closeOv();CUR=null;CALL=null;toast("Удалено: "+nm);draw();});}
  if(c("[data-banko]"))return openBankNo(CUR);
  if(c("[data-del]"))return confirmDel(CUR);
  if(c("[data-picknew]")){closeOv();ADDMODE="one";IMP=null;return setTab("add");}
  if(c("[data-imp]")){ADDMODE="list";IMP=null;return setTab("add");}
  if(c("[data-addclose]")){ADDMODE="one";IMP=null;return setTab("today");}
  const am=c("[data-addmode]");if(am){ADDMODE=am.dataset.addmode;IMP=null;return drawAdd();}
  const sg=c("[data-seg]");if(sg){SEG=sg.dataset.seg;QTXT="";return drawToday();}
  const fl=c("[data-filt]");if(fl){FILT=fl.dataset.filt;SEG="calls";QTXT="";return kc(drawToday);}
  const sn=c("[data-sortnew]");if(sn){SORT_NEW=sn.dataset.sortnew;return kc(fillToday);}
  if(c("[data-newall]")){NEW_ALL=!NEW_ALL;return kc(fillToday);}
  const cc=c("[data-chipcl]");if(cc){FILT_CL=cc.dataset.chipcl;return kc(()=>drawLeads(false));}
  const af=c("[data-archf]");if(af){ARCH_F=af.dataset.archf;return kc(drawArchive);}
  const ao=c("[data-archopen]");if(ao){ARCH_OPEN=ARCH_OPEN===ao.dataset.archopen?null:ao.dataset.archopen;return drawArchive();}
  const rt=c("[data-return]");if(rt)return returnLead(rt.dataset.return);
  const sc=c("[data-startcall]");if(sc)return startCall(sc.dataset.startcall);
  const op=c("[data-open]");if(op){CUR=op.dataset.open;CALL=null;EDIT_STEP=HOOK_F=PH_F=false;return draw();}
  if(c("[data-back]")){CUR=null;EDIT_STEP=HOOK_F=PH_F=false;return draw();}
  if(c("[data-editstep]")){EDIT_STEP=true;return drawLead(CUR);}
  if(c("[data-editcancel]")){EDIT_STEP=false;return drawLead(CUR);}
  if(c("[data-cnew]"))return contactSheet(null);
  const ce=c("[data-cedit]");if(ce)return contactSheet(+ce.dataset.cedit);
  const ca=c("[data-cadd]");if(ca)return contactSheet(+ca.dataset.cadd,{addPhone:true});
  if(c("[data-nadd]"))return notesSheet(null,true);
  if(c("[data-nall]"))return notesSheet(null,false);
  const cp=c("[data-copy]");if(cp&&cp.dataset.copy)return copy(cp.dataset.copy);
  if(c("[data-callclose]")){const inn=CALL.inn;CALL=null;CUR=inn;return draw();}
  if(CALL){
    if(c("[data-pickct]"))return pickCt();
    if(c("[data-fdadd]"))return askContact();
    const nx=c("[data-next]");
    if(nx){if(nx.dataset.next==="@custom")return askTheme(CALL.hist[CALL.hist.length-1].id);if(nx.dataset.next==="@who")return askWho();const th=nx.dataset.theme||CALL.hist[CALL.hist.length-1].theme;CALL.hist.push({id:nx.dataset.next,theme:th});drawCall();window.scrollTo(0,0);if(FD_NODES.includes(nx.dataset.next))askContact();return;}
    if(c("[data-callback]")){if(CALL.hist.length>1){CALL.hist.pop();drawCall();}else{const inn=CALL.inn;CALL=null;CUR=inn;draw();}}
  }
});
